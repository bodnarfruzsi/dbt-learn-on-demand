unit_tests:
  - name: stg_orders_status_contains_only_expected_values
    description: >
      Statuses from the source pass through stg_orders unchanged, and every
      one is one of the values accepted by the accepted_values test on
      stg_orders.status.
    model: stg_orders
    given:
      - input: source('jaffle_shop', 'orders')
        rows:
          - {id: 1, user_id: 1, order_date: '2018-01-01', status: completed}
          - {id: 2, user_id: 2, order_date: '2018-01-02', status: shipped}
          - {id: 3, user_id: 3, order_date: '2018-01-03', status: returned}
          - {id: 4, user_id: 4, order_date: '2018-01-04', status: placed}
          - {id: 5, user_id: 5, order_date: '2018-01-05', status: return_pending}
          - {id: 6, user_id: 6, order_date: '2018-01-06', status: cancelled}
    expect:
      rows:
        - {order_id: 1, customer_id: 1, order_date: '2018-01-01', status: completed}
        - {order_id: 2, customer_id: 2, order_date: '2018-01-02', status: shipped}
        - {order_id: 3, customer_id: 3, order_date: '2018-01-03', status: returned}
        - {order_id: 4, customer_id: 4, order_date: '2018-01-04', status: placed}
        - {order_id: 5, customer_id: 5, order_date: '2018-01-05', status: return_pending}
        - {order_id: 6, customer_id: 6, order_date: '2018-01-06', status: cancelled}

  - name: fct_orders_days_since_ordered
    description: >
      days_since_ordered is the number of days between order_date and the
      current timestamp. The current timestamp is overridden so the result is fixed.
    model: fct_orders
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 1, order_date: '2018-01-01'}
      - input: ref('stg_payments')
        rows:
          - {order_id: 1, status: success, amount: 10}
    overrides:
      macros:
        dbt.current_timestamp: "to_timestamp('2018-01-10 00:00:00')"
    expect:
      rows:
        - {order_id: 1, customer_id: 1, order_date: '2018-01-01', amount: 10, days_since_ordered: 9}
