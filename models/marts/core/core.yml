version: 2

models:
  - name: dim_customers
    description: One row per customer, with order history.
    columns:
      - name: customer_id
        description: Primary key for customers.
        tests:
          - unique
          - not_null
          - dbt_utils.cardinality_equality:
              arguments:
                field: customer_id
                to: ref('stg_customers')

  - name: fct_orders
    description: One row per order, with the amount paid.
    columns:
      - name: order_id
        description: Primary key for orders.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: The customer who placed the order.
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: amount
        description: Total successful payment amount for the order, in dollars.
        tests:
          - dbt_expectations.expect_column_mean_to_be_between:
              arguments:
                min_value: 1
                group_by: [customer_id]
                row_condition: "order_id is not null"
                strictly: false
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false

  - name: int_orders__pivoted
    description: One row per order, with the amount paid by each payment method.
    columns:
      - name: order_id
        description: Primary key for orders.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                severity: warn
